[project]
name = "tagger-mcp"
version = "0.1.0"
description = "MCP server: extracts structured garment tags from a sewing item summary via DeepSeek"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]
