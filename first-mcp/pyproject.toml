[project]
name = "first-mcp"
version = "0.1.0"
description = "My first MCP server"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "pypdf>=4.0.0",
    "pymupdf>=1.24.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[project.scripts]
first-mcp = "server:main"
