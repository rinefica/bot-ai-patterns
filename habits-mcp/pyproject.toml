[project]
name = "habits-mcp"
version = "0.1.0"
description = "Habit tracker MCP server with periodic reminders"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.0.0",
    "apscheduler>=3.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[project.scripts]
habits-mcp = "server:main"
