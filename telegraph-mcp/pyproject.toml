[project]
name = "telegraph-mcp"
version = "0.1.0"
description = "MCP server for creating Telegraph pages with sewing pattern collections"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "requests>=2.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["server.py"]

[project.scripts]
telegraph-mcp = "server:main"
